<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Antonio Trento</title>
	<meta name="description" content="Antonio Trento — system architect. Agenti, Docker, integrazioni." />
	<link rel="canonical" href="https://antoniotrento.github.io/" />
	<meta property="og:title" content="Antonio Trento" />
	<meta property="og:description" content="System architect. Agenti, Docker, integrazioni." />
	<meta property="og:image" content="https://antoniotrento.github.io/images/hero-antonio.jpg" />
	<meta property="og:url" content="https://antoniotrento.github.io/" />
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Inter', 'system-ui', 'sans-serif'],
					},
					colors: {
						brand: {
							black: '#202124',
							blue: '#4285F4',
							red: '#EA4335',
							yellow: '#FBBC04',
							green: '#34A853',
						}
					},
					animation: {
						'pulse-slow': 'pulse 5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
						'float': 'float 7s ease-in-out infinite',
						'ken': 'ken 28s ease-in-out infinite alternate',
					},
					keyframes: {
						float: {
							'0%, 100%': { transform: 'translateY(0)' },
							'50%': { transform: 'translateY(-16px)' },
						},
						ken: {
							'0%': { transform: 'scale(1)' },
							'100%': { transform: 'scale(1.08)' },
						},
					},
				},
			},
		}
	</script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
	<style>
		body { font-family: Inter, system-ui, sans-serif; }
		.reveal { opacity: 0; transform: translateY(24px); animation: in .9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
		.d1 { animation-delay: .12s; }
		.d2 { animation-delay: .28s; }
		.d3 { animation-delay: .44s; }
		@keyframes in { to { opacity: 1; transform: none; } }
	</style>
</head>
<body class="bg-brand-black text-white overflow-hidden">

	<main class="relative min-h-screen">
		<!-- Foto: viso a sinistra, spazio a destra per il testo -->
		<picture>
			<source media="(max-width: 767px)" srcset="images/hero-antonio-mobile.jpg">
			<img src="images/hero-antonio.jpg" alt="Antonio Trento"
				class="absolute inset-0 w-full h-full object-cover object-[18%_center] md:object-[22%_center] animate-ken origin-left">
		</picture>

		<!-- Leggibilità: a destra più scuro, viso quasi libero -->
		<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/35 to-black/20 md:bg-gradient-to-r md:from-black/25 md:via-black/45 md:to-black/85"></div>

		<!-- Stessa grafica: blob Google -->
		<div class="absolute inset-0 overflow-hidden pointer-events-none">
			<div class="absolute top-[-10%] right-[-8%] w-[520px] h-[520px] bg-brand-blue/20 rounded-full blur-[120px] animate-pulse-slow"></div>
			<div class="absolute bottom-[-12%] right-[10%] w-[380px] h-[380px] bg-brand-red/15 rounded-full blur-[110px] animate-pulse-slow" style="animation-delay: 2s;"></div>
			<div class="absolute top-[30%] right-[28%] w-[220px] h-[220px] bg-brand-yellow/10 rounded-full blur-[80px] animate-float"></div>
		</div>

		<div class="relative z-10 min-h-screen flex items-end md:items-center justify-center md:justify-end px-6 py-16 md:px-20 lg:px-28">
			<div class="w-full max-w-lg text-center md:text-left">
				<p class="reveal text-xs font-bold tracking-[0.22em] uppercase text-white/70 mb-5">System architect</p>
				<h1 class="reveal d1 text-5xl md:text-7xl font-black tracking-tighter leading-[0.95] mb-5">
					Antonio<br>Trento
				</h1>
				<p class="reveal d2 text-lg md:text-xl font-light text-white/80 mb-10 max-w-md md:max-w-none mx-auto md:mx-0">
					Togli il lavoro a mano tra un software e l’altro. Che si parlino da soli!
				</p>

				<nav class="reveal d3 flex justify-center md:justify-start gap-4 md:gap-5" aria-label="Link">
					<a href="https://antoniotrento.net/"
						class="group flex flex-col items-center gap-2 w-16 md:w-20 text-white/90 hover:text-white">
						<span class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-xl group-hover:bg-brand-blue group-hover:border-brand-blue group-hover:-translate-y-1 transition-all duration-300">
							<i class="fa-solid fa-globe"></i>
						</span>
						<span class="text-[11px] font-bold uppercase tracking-wider">Sito</span>
					</a>
					<a href="https://blog.antoniotrento.net/it/"
						class="group flex flex-col items-center gap-2 w-16 md:w-20 text-white/90 hover:text-white">
						<span class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-xl group-hover:bg-brand-blue group-hover:border-brand-blue group-hover:-translate-y-1 transition-all duration-300">
							<i class="fa-solid fa-pen-nib"></i>
						</span>
						<span class="text-[11px] font-bold uppercase tracking-wider">Blog</span>
					</a>
					<a href="https://www.linkedin.com/in/antoniotrento"
						class="group flex flex-col items-center gap-2 w-16 md:w-20 text-white/90 hover:text-white">
						<span class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-xl group-hover:bg-brand-blue group-hover:border-brand-blue group-hover:-translate-y-1 transition-all duration-300">
							<i class="fa-brands fa-linkedin-in"></i>
						</span>
						<span class="text-[11px] font-bold uppercase tracking-wider">LinkedIn</span>
					</a>
					<a href="https://github.com/antoniotrento"
						class="group flex flex-col items-center gap-2 w-16 md:w-20 text-white/90 hover:text-white">
						<span class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-xl group-hover:bg-brand-blue group-hover:border-brand-blue group-hover:-translate-y-1 transition-all duration-300">
							<i class="fa-brands fa-github"></i>
						</span>
						<span class="text-[11px] font-bold uppercase tracking-wider">GitHub</span>
					</a>
				</nav>
			</div>
		</div>
	</main>

</body>
</html>
